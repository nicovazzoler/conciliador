[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conciliador"
version = "0.1.0"
description = "Cruza gastos reales contra lo planificado."
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "pdfplumber>=0.11", "alembic>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[tool.setuptools]
packages = ["conciliador", "conciliador.lectores"]

[tool.setuptools.package-data]
conciliador = ["migraciones/*", "migraciones/versions/*", "consultas/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
